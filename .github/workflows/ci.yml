name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  metrics-and-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/audit_public_repo.py
  inference-rewrites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_models.py' -v
